name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build -o bin/airun ./cmd/airun/

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: profile adapter and history tests (Linux, non-root)
        run: node --test docker/component-adapter.test.mjs docker/profile-start.test.mjs

      - name: e2e (offline, docker-shim)
        run: AIRUN_TEST_ENV=/dev/null bash test/e2e/run-all.sh --no-build

  profile-activation:
    name: real Claude profile activation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: build compatible image
        run: docker build -t agent-runtime:profiles-dev docker/
      - name: exercise native activation without external networking
        run: bash test/profile-activation/run.sh
      - name: exercise production entrypoint and fresh state
        run: bash test/profile-entrypoint/run.sh

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
